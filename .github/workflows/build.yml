name: Multi-Platform Build v2.0

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # Windows'u çıkardık, sen manuel yapacaksın

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn yt-dlp

    - name: Archive Project
      run: |
        zip -r C-Down-${{ matrix.os }}.zip . -x "*.git*" "ffmpeg.exe" # Gereksizleri dahil etme

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: C-Down-Package-${{ matrix.os }}
        path: *.zip
