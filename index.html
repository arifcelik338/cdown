<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C DoWn Downlander </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0033 0%, #2d004d 50%, #0d001f 100%);
            color: #e0d5ff;
            font-family: 'Georgia', 'Garamond', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: 120px;
        }

/* Masaüstü ve genel ayarlar zaten sende var, ama container'ı şöyle güncelle: */
.container {
    width: 90%;          /* Mobilde ekranın %90'ını kaplasın */
    max-width: 500px;    /* Ama bilgisayarda 500px'i geçmesin */
    padding: 20px;       /* İç boşluğu biraz daraltalım */
    margin: 20px auto;   /* Ortalamayı garantileyelim */
}

/* SADECE MOBİL İÇİN (Ekran 600px'den küçükse): */
@media (max-width: 600px) {
    h2 {
        font-size: 1.5rem; /* Başlık telefonda biraz daha küçük olsun */
    }
    
    input[type="text"], button {
        padding: 15px;      /* Parmakla basmak kolay olsun diye butonları büyütelim */
        font-size: 16px;    /* Mobilde 16px altı fontlar bazen ekranın otomatik zoom yapmasına neden olur */
    }

    .container {
        padding: 15px;      /* Mobilde ekran alanı değerli, boşlukları kısalım */
        width: 95%;         /* Telefonda iyice yayılsın */
    }
}

        h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #d4a574;
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: normal;
        }

        input[type="text"] {
            width: 100%;
            max-width: 350px;
            padding: 12px 15px;
            margin: 15px 0;
            background: rgba(60, 30, 90, 0.6);
            border: 2px solid #8b4789;
            color: #e0d5ff;
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #b09acc;
        }

        input[type="text"]:focus {
            outline: none;
            background: rgba(80, 40, 120, 0.8);
            box-shadow: 0 0 15px rgba(139, 71, 137, 0.8);
            border-color: #d4a574;
        }

        button {
            padding: 12px 30px;
            margin: 15px 0;
            background: linear-gradient(135deg, #8b4789 0%, #5d2e61 100%);
            color: #d4a574;
            border: 2px solid #d4a574;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #b5529f 0%, #7d3e7f 100%);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        #sonucAlani {
            margin-top: 30px;
            min-height: 50px;
            text-align: center;
        }

        #sonucAlani p {
            font-size: 16px;
            margin: 10px 0;
            line-height: 1.6;
        }

        #sonucAlani p strong {
            color: #d4a574;
            text-shadow: 0 0 5px rgba(212, 165, 116, 0.5);
        }

        #sonucAlani a {
            text-decoration: none;
        }

        #sonucAlani button {
            width: 100%;
            max-width: 300px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to top, rgba(20, 10, 35, 0.95), rgba(20, 10, 35, 0.8));
            border-top: 2px solid #8b4789;
            box-shadow: 0 -2px 10px rgba(139, 71, 137, 0.3);
            z-index: 100;
        }

        footer a {
            color: #d4a574;
            text-decoration: none;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(212, 165, 116, 0.5);
            font-size: 16px;
            letter-spacing: 1px;
        }

        footer a:hover {
            text-shadow: 0 0 15px rgba(212, 165, 116, 0.8);
            color: #e0d5ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>C DoWn Downlander </h2>
        <input type="text" id="linkGirdisi" placeholder="YouTube linkini yapıştır">
        <button onclick="videoyuBul()">Bul</button>

        <div id="sonucAlani"></div>
    </div>

    <footer>
        <a href="https://youtube.com/@arifcelik1" target="_blank">Arif Çelik</a>
    </footer>
    <script>
        async function videoyuBul() {
    const sonucAlani = document.getElementById('sonucAlani');
    const url = document.getElementById('linkGirdisi').value; // Burada adı 'url' koyduk
    
    sonucAlani.innerHTML = "Aranıyor, lütfen bekleyin...";

    try {
        // FETCH İÇİNDE: `${url}` olarak düzelttim (yukarıdakiyle aynı olmalı)
        const response = await fetch(`https://arifcelik338-cdown.hf.space/link-coz?video_url=${url}`);
        
        // JSON ÇEVİRİRKEN: 'response.json()' olarak düzelttim (yukarıdaki değişkenle aynı olmalı)
        const veri = await response.json();

        if(veri.durum === "basarili") {
            sonucAlani.innerHTML = `
                <img src="${veri.kapak}" style="width:100%; border-radius:10px; margin-bottom:15px; border: 2px solid #333;">
                <p><strong>${veri.baslik}</strong></p>
                <a href="${veri.indirme_linki}" target="_blank">
                    <button class="indir-btn">Hemen İndir</button>
                </a>
            `;
        } else {
            sonucAlani.innerHTML = `<p style="color:red;">Hata: ${veri.mesaj}</p>`;
        }

    } catch (hata) {
        console.error(hata); // Hatanın ne olduğunu tarayıcı konsolunda görebilmek için
        sonucAlani.innerHTML = "Sunucuya bağlanılamadı. Lütfen API linkini ve internetini kontrol et.";
    }
}
    </script>
</body>
</html>
