<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C DoWn Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0033 0%, #2d004d 50%, #0d001f 100%);
            color: #e0d5ff;
            font-family: 'Georgia', 'Garamond', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: 120px;
        }

        .container {
            width: 100%;         
            max-width: 500px;  
            padding: 40px 30px;      
            margin: 20px auto; 
            background: rgba(20, 10, 35, 0.85);
            border: 2px solid #8b4789;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(139, 71, 137, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        @media (max-width: 600px) {
            h2 { font-size: 1.8rem; }
            input[type="text"], button { padding: 15px; font-size: 16px; }
            .container { padding: 25px 15px; width: 95%; }
        }

        h2 {
            font-size: 2.5em;
            margin-bottom: 25px;
            color: #d4a574;
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: normal;
        }

        input[type="text"] {
            width: 100%;
            max-width: 350px;
            padding: 12px 15px;
            margin: 10px 0 20px 0;
            background: rgba(60, 30, 90, 0.6);
            border: 2px solid #8b4789;
            color: #e0d5ff;
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #b09acc;
            text-align: center;
        }

        input[type="text"]:focus {
            outline: none;
            background: rgba(80, 40, 120, 0.8);
            box-shadow: 0 0 15px rgba(139, 71, 137, 0.8);
            border-color: #d4a574;
        }

        button {
            padding: 12px 30px;
            margin: 10px 0;
            background: linear-gradient(135deg, #8b4789 0%, #5d2e61 100%);
            color: #d4a574;
            border: 2px solid #d4a574;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.3);
            width: 100%;
            max-width: 350px;
        }

        button:hover {
            background: linear-gradient(135deg, #b5529f 0%, #7d3e7f 100%);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        #resultArea {
            margin-top: 25px;
            min-height: 50px;
            text-align: center; 
        }

        #resultArea p { font-size: 16px; margin: 10px 0; line-height: 1.6; }
        #resultArea p strong { color: #d4a574; text-shadow: 0 0 5px rgba(212, 165, 116, 0.5); }
        #resultArea a { text-decoration: none; }
        #resultArea button { width: 100%; max-width: 350px; }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 20px;
            background: linear-gradient(to top, rgba(20, 10, 35, 0.95), rgba(20, 10, 35, 0.8));
            border-top: 2px solid #8b4789;
            box-shadow: 0 -2px 10px rgba(139, 71, 137, 0.3);
            z-index: 100;
        }

        footer a {
            color: #d4a574;
            text-decoration: none;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px rgba(212, 165, 116, 0.5);
            font-size: 16px;
            letter-spacing: 1px;
        }

        footer a:hover {
            text-shadow: 0 0 15px rgba(212, 165, 116, 0.8);
            color: #e0d5ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>C DoWn Downloader</h2>
        <input type="text" id="linkInput" placeholder="Paste Video link Here">
        <button onclick="findVideo()">Find</button>

        <div id="resultArea"></div>
    </div>

    <footer>
        <a href="https://youtube.com/@arifcelik1" target="_blank">Arif Çelik</a>
    </footer>
    
    <script>
        async function findVideo() {
            const resultArea = document.getElementById('resultArea');
            const linkInput = document.getElementById('linkInput');
            const url = linkInput.value;
            
            if (!url) {
                resultArea.innerHTML = "<p style='color: #d4a574;'>Please enter a link first.</p>";
                return;
            }
            
            resultArea.innerHTML = "Searching, please wait...";

            try {
                const apiResponse = await fetch(`http://localhost:8000/link-coz?video_url=${url}`);
                const data = await apiResponse.json();

                if(data.durum === "basarili") {
                    // YENİ: Doğrudan indirme yerine Python köprüsüne (video-indir) istek atıyoruz
                    const proxyUrl = `http://localhost:8000/video-indir?url=${encodeURIComponent(data.indirme_linki)}&baslik=${encodeURIComponent(data.baslik)}`;

                    resultArea.innerHTML = `
                        <img src="${data.kapak}" style="width:100%; border-radius:10px; margin-bottom:15px; border: 2px solid #8b4789; box-shadow: 0 0 10px rgba(139, 71, 137, 0.3);">
                        
                        <p><strong>${data.baslik}</strong></p>
                        
                        <a href="${proxyUrl}" onclick="document.getElementById('linkInput').value = '';">
                            <button class="indir-btn">Download Now</button>
                        </a>
                    `;
                } else {
                    resultArea.innerHTML = `<p style="color:#d4a574;">Error: ${data.mesaj}</p>`;
                }

            } catch (error) {
                resultArea.innerHTML = "<p style='color:#d4a574;'>Could not connect to the server.</p>";
            }
        }
    </script>
</body>
</html>
